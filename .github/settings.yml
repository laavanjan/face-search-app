# Repository settings as code (GOV-01). Applied by the "Settings" GitHub App
# (https://github.com/apps/settings) when installed; otherwise apply the same
# values by hand in Settings -> Branches. Owner: @laavanjan.
branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        require_code_owner_reviews: true
        dismiss_stale_reviews: true
      required_status_checks:
        strict: true
        contexts:
          - backend-tests
          - frontend-build
          - governance-docs
          - change-record
          - codeowner-approval
      enforce_admins: false
      restrictions: null
