name: CI

on:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # GOV-01: changes need approval from the accountable owner in .github/CODEOWNERS.
  # A PR passes only if its author is a code owner or a code owner has approved
  # it. Make this a required status check on main (see .github/settings.yml).
  codeowner-approval:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require code-owner approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          owners=$(grep -E '^\*\s' .github/CODEOWNERS | grep -oE '@[A-Za-z0-9_-]+' | tr -d '@' | sort -u)
          echo "Code owners: $owners"
          if echo "$owners" | grep -qx "$AUTHOR"; then
            echo "Author $AUTHOR is a code owner."; exit 0
          fi
          approvers=$(gh api "repos/${{ github.repository }}/pulls/$PR/reviews"             --jq '[.[] | select(.state=="APPROVED") | .user.login] | unique | .[]')
          for o in $owners; do
            if echo "$approvers" | grep -qx "$o"; then echo "Approved by code owner $o."; exit 0; fi
          done
          echo "::error::This change needs approval from a code owner: $owners"
          exit 1

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Tests mock InsightFace, so skip the heavy model packages.
      - run: cat requirements.txt requirements-dev.txt | grep -vE '^(insightface|onnxruntime|-r )' > /tmp/req.txt && pip install -r /tmp/req.txt
      - run: pytest

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npx next build

  governance-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/check_governance.py

  # Material changes need a change record (governance/change-management.yaml).
  change-record:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require docs/changes/CHG-*.md when governance-sensitive files change
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          echo "$changed"
          sensitive=$(echo "$changed" | grep -E '^(backend/app/config\.py|backend/app/security\.py|backend/app/services/(face_engine|pipeline|vector_store|storage|rekognition|review|controls|retention|privacy)\.py|backend/\.env\.example|backend/requirements\.txt|backend/Dockerfile|docker-compose\.yml)$' || true)
          record=$(echo "$changed" | grep -E '^docs/changes/CHG-[0-9]+.*\.md$' || true)
          if [ -n "$sensitive" ] && [ -z "$record" ]; then
            echo "::error::Governance-sensitive files changed without a change record in docs/changes/:"
            echo "$sensitive"
            exit 1
          fi
