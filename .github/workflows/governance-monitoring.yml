# Weekly governance monitoring (docs/governance/monitoring-schedule.md).
# Owner: System Owner (@laavanjan). A failing run opens a `governance-review` issue.
name: Governance monitoring

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Governance documents present and in date
        run: python scripts/check_governance.py

      - name: Install backend (without model packages)
        working-directory: backend
        run: cat requirements.txt requirements-dev.txt | grep -vE '^(insightface|onnxruntime|-r )' > /tmp/req.txt && pip install -r /tmp/req.txt

      - name: Backend test suite (access control, review gates, retention, privacy)
        working-directory: backend
        run: pytest

      # FAIR-06: weekly fairness monitoring, broken down by protected group.
      # FAIRNESS_MANIFEST points at the consented evaluation set (protected artifact).
      # Exit 1 = parity limits breached (fails the run); exit 2 = no real data yet (warning).
      - name: Fairness monitoring
        env:
          FAIRNESS_MANIFEST: ${{ secrets.FAIRNESS_MANIFEST_PATH }}
          FAIRNESS_REPORT_DIR: fairness-reports
        run: python backend/scripts/monitor_fairness.py || [ $? -eq 2 ]

      - name: Keep fairness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fairness-report
          path: fairness-reports/

      - name: API boots and /health is healthy
        working-directory: backend
        env:
          API_KEYS: monitor:viewer:ci-monitor-token
          GOVERNANCE_DB_PATH: /tmp/gov/governance.db
          LOCAL_PHOTO_DIR: /tmp/photos
        run: |
          uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          python - <<'EOF'
          import json, sys
          h = json.load(open("/tmp/health.json"))
          assert h["status"] == "ok", h
          assert h["config_approved"] is True, h
          print("health ok")
          EOF
          # Protected routes must refuse anonymous callers.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/gallery)" = "401"

      - name: Open issue for the accountable owner on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create governance-review --color B60205 --force || true
          gh issue create \
            --title "Governance monitoring failed ($(date -u +%F))" \
            --label governance-review \
            --assignee laavanjan \
            --body "The weekly governance monitoring run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Triage per governance/incident-response.yaml (P2 if not explained within 2 business days)."
