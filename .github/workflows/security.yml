# Supply-chain security gates (SEC-03, SEC-05). Required status checks on main
# via .github/settings.yml, together with CI's codeowner-approval (PR review
# before merge). Policy: governance/vulnerability-management.yaml.
#
#   secret-scan       gitleaks over the full git history; fails on any committed secret
#   sbom              CycloneDX SBOM of backend + frontend dependencies (artifact `sbom`)
#   dependency-audit  pip-audit + npm audit; fails on known-vulnerable pinned versions
#   lockfile          hash-pinned backend lock (pip-compile --generate-hashes); fails
#                     if backend/requirements.lock is missing or out of date
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1" # weekly re-scan for newly published CVEs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python dependencies (pip-audit)
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt --desc
      - name: Frontend dependencies (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high

  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve hash-pinned lock
        working-directory: backend
        run: |
          pip install pip-tools==7.4.1
          pip-compile --quiet --generate-hashes --strip-extras --output-file /tmp/requirements.lock requirements.txt
      - uses: actions/upload-artifact@v7
        with:
          name: requirements.lock
          path: /tmp/requirements.lock
      - name: Committed lock must match
        run: |
          if [ ! -f backend/requirements.lock ]; then
            echo "::error::backend/requirements.lock missing - download the 'requirements.lock' artifact and commit it"; exit 1
          fi
          diff <(grep -E '^[A-Za-z0-9_.-]+==' backend/requirements.lock | sort) <(grep -E '^[A-Za-z0-9_.-]+==' /tmp/requirements.lock | sort) \
            || { echo "::error::backend/requirements.lock is out of date with requirements.txt"; exit 1; }
