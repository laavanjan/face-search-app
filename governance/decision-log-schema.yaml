# Decision log schema (DOC-04, TRAN-05, TRAN-06). Table audit_log (backend/app/services/db.py),
# written by backend/app/services/audit.py on every decision path. Integrity: governance/audit-log-integrity.yaml
document: decision-log-schema
owner: "@laavanjan"
next_review: 2027-01-14
columns:
  ts: "epoch seconds"
  actor: "HMAC pseudonym of the person (or system/anonymous)"
  roles: "roles held when acting"
  action: "event name, e.g. search.candidate.approve"
  target: "case/photo/appeal id"
  trace_id: "request trace id (app/tracing.py, X-Request-ID header) - links the HTTP input to every row it produced"
  rationale: "structured JSON - see rationale_fields"
  detail: "small extra context"
  prev_hash: "hash of the previous row"
  row_hash: "SHA-256 over prev_hash + this row (tamper evidence)"
rationale_fields:
  inputs: "what the decision used: candidate ids + scores, face det/quality scores, query faces, change_id, settings diff"
  output: "{decision, action, target} - what was decided, about what"
  decision: "outcome, e.g. approve | reject | pending_review | completed | stopped | delete | pause"
  reason: "the human's stated reason (required for human decisions)"
  model: "FACE_MODEL_NAME in force"
  threshold: "SEARCH_MIN_THRESHOLD in force"
  config_fingerprint: "hash of governance-sensitive settings in force"
input_to_output_linkage: "Same trace_id on the request log line, the X-Request-ID response header, every audit row and the output's provenance block (services/provenance.py)"
decision_paths_logged:
  - "photo.upload, index.approve, index.reject"
  - "search.case_created (every candidate score), search.candidate.approve|reject|reopen, search.manual_match"
  - "search.case.completed|no_match|stopped|escalated, search.case.reopen"
  - "appeal.submit (incl. abuse_report), appeal.resolve"
  - "control.indexing|search.pause|resume, config.approve, photo.delete, retention.sweep"
reconstruction: "Given a case id: case_created inputs list candidates and scores; each candidate row has reviewer, reason, score; the close row's inputs list approved/rejected ids; model + threshold + config_fingerprint identify the configuration; trace_id ties it to the request"
verification:
  - backend/tests/test_transparency.py::test_decisions_logged_with_trace_and_structured_rationale
  - backend/tests/test_security.py::test_hash_chain_detects_tampering
