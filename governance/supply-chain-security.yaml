# Supply-chain controls (SEC-03).
document: supply-chain-security
owner: "@laavanjan"
next_review: 2027-01-14
lockfiles:
  frontend: "frontend/package-lock.json - every package pinned with integrity hash"
  backend_direct: "backend/requirements.txt - every direct dependency pinned with =="
  backend_full: "backend/requirements.lock - full transitive set with sha256 hashes, generated by .github/workflows/security.yml job lockfile (pip-compile --generate-hashes); job fails if missing or stale"
  dev: "backend/requirements-dev.txt - pinned evaluation/test tools"
sbom: "CycloneDX JSON generated on every PR/push and weekly by security.yml job sbom (anchore/sbom-action), kept as artifact sbom.cdx.json"
secret_scanning: "gitleaks over full history on every PR/push/weekly (security.yml job secret-scan, config .gitleaks.toml); plus tests/test_security.py::test_no_hardcoded_secrets_in_app_code"
branch_protection:
  declared_in: .github/settings.yml
  rules: ["pull request required", "1 approving review", "code-owner review (.github/CODEOWNERS)", "required checks: backend-tests, frontend-build, governance-docs, change-record, codeowner-approval, secret-scan, dependency-audit, lockfile"]
  enforced_in_ci: ".github/workflows/ci.yml job codeowner-approval fails unless a code owner authored or approved the PR"
dependency_updates: ".github/dependabot.yml (pip, npm, github-actions, docker) weekly"
vulnerability_scanning: "pip-audit + npm audit (security.yml job dependency-audit), weekly scheduled re-scan"
